server {
    listen ${PORT};
    server_name localhost;
    root /app/dist;
    index index.html;

    # Defensive Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=self" always;
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://*.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: https://*.razorpay.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https: http: https://lumberjack.razorpay.com https://api.razorpay.com https://*.razorpay.com; frame-src 'self' blob: data: https: https://checkout.razorpay.com https://api.razorpay.com https://*.razorpay.com;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
